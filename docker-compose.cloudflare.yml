services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: indogame
      POSTGRES_USER: indogame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indogame -d indogame"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: reg-loq.rezafahrur.com:5254/indogame-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=indogame;Username=indogame;Password=${POSTGRES_PASSWORD}"
      AdminToken: ${ADMIN_TOKEN}
      ASPNETCORE_URLS: "http://+:5080"
    expose:
      - "5080"

  frontend:
    image: reg-loq.rezafahrur.com:5254/indogame-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pgdata: